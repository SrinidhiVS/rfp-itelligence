services:
  rfp-intelligence:
    build:
      context: .
    init: true
    ports:
      - "127.0.0.1:8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      HF_HOME: /home/rfp/.cache/huggingface
      RFP_INDEX_PATH: /app/output/search-index.json
      RFP_CHROMA_PATH: /app/output/chroma
      RFP_TRACE_PATH: /app/traces/runtime-trace.json
      RFP_SUBMISSION_ROOT: /app/output/imported-bids
    volumes:
      - ./Initial_docs:/app/Initial_docs:ro
      - rfp-output:/app/output
      - rfp-traces:/app/traces
      - rfp-model-cache:/home/rfp/.cache/huggingface
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s
    stop_grace_period: 20s

volumes:
  rfp-output:
  rfp-traces:
  rfp-model-cache:
